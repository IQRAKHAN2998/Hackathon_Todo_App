name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]  # Replace 'main' if your branch has a different name

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USERNAME: ${{ secrets.HF_USERNAME }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
      run: |
        # Git setup
        git config --global user.email "bot@github.com"
        git config --global user.name "Bot"

        # Clone Hugging Face Space
        git clone https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf

        # Copy backend folder files to Hugging Face Space
        cp todo_app_backend/app.py hf/
        cp todo_app_backend/requirements.txt hf/
        cp todo_app_backend/Dockerfile hf/

        # Commit and push changes
        cd hf
        git add .
        git commit -m "Deploy" || echo "No changes to commit"
        git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main
