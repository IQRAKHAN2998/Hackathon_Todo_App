name: Deploy to Hugging Face

on:
  push:
    branches: [ main ]  # Change if your branch name is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Deploy to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
        HF_USERNAME: ${{ secrets.HF_USERNAME }}
        HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
      run: |
        # Git setup
        git config --global user.email "bot@github.com"
        git config --global user.name "Bot"

        # Clone Hugging Face Space
        git clone https://huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME hf

        # Copy all files from backend folder to Hugging Face Space root
        cp -r todo_app_backend/* hf/

        # Commit and push changes
        cd hf
        git add .
        git commit -m "Deploy" || echo "No changes to commit"
        git push https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main
